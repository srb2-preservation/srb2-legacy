name: SDL GPU shaders

# Compiles the game's shaders for the SDL GPU renderer, and checks that the
# ones kept in the repository are up to date:
#  - precompiled/spirv.c (Vulkan) and precompiled/msl.c (Metal) can be made
#    anywhere, with tools/sdlgpu-shaders. This fails if they don't match the
#    shaders.
#  - precompiled/dxil.c (Direct3D 12) needs Microsoft's DXC, which
#    only runs on x86-64. It is made here and uploaded as an artifact, to be
#    committed. This warns if the committed one doesn't match the shaders.

on:
  push:
    branches: [ "next", "master", "ci" ]
  pull_request:
    branches: [ "next", "master" ]

env:
  DXC_VERSION: v1.9.2609
  DXC_FILE: linux_dxc_2026_09_28.x86_x64.tar.gz
  DXC_SHA256: 96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1

jobs:
  shaders:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt install -y pkg-config libshaderc-dev libspirv-cross-c-shared-dev

    - name: Get DXC
      run: |
       curl -fsSL -o "$DXC_FILE" "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_VERSION/$DXC_FILE"
       echo "$DXC_SHA256  $DXC_FILE" | sha256sum -c -
       mkdir dxc
       tar xzf "$DXC_FILE" -C dxc
       echo "LD_LIBRARY_PATH=$PWD/dxc/lib" >> "$GITHUB_ENV"

    - name: Build the shader tool
      run: make -C tools/sdlgpu-shaders gen

    - name: Compile the shaders
      run: |
       GPUDIR=src/hardware/r_sdlgpu/precompiled
       for format in spirv msl dxil; do
           cp $GPUDIR/$format.c committed_$format.c
       done
       make -C tools/sdlgpu-shaders all
       make -C tools/sdlgpu-shaders dxil DXC="$PWD/dxc/bin/dxc"

    # The shader programs are found by the hash of their GLSL, so comparing
    # hashes doesn't depend on the versions of the tools that compiled them.
    - name: Check the shaders in the repository
      run: |
       GPUDIR=src/hardware/r_sdlgpu/precompiled
       hashes() { grep -o '0x[0-9a-f]\{16\}ULL' "$1" | sort -u; }
       hashes $GPUDIR/spirv.c > needed.txt
       if ! diff <(hashes $GPUDIR/msl.c) needed.txt > /dev/null; then
           echo "::error::SPIRV-Cross didn't translate every shader program for Metal."
           exit 1
       fi
       for format in spirv msl; do
           if ! diff <(hashes committed_$format.c) needed.txt > /dev/null; then
               echo "::error::precompiled/$format.c is out of date: run make in tools/sdlgpu-shaders and commit it."
               exit 1
           fi
       done
       if ! diff <(hashes $GPUDIR/dxil.c) needed.txt > /dev/null; then
           echo "::error::DXC didn't compile every shader program."
           exit 1
       fi
       if ! diff <(hashes committed_dxil.c) needed.txt > /dev/null; then
           echo "::warning::precompiled/dxil.c is out of date: Direct3D 12 won't work. Commit the one in the sdlgpu-shaders-dxil artifact."
           echo "precompiled/dxil.c is out of date. Download the **sdlgpu-shaders-dxil** artifact of this run and commit its dxil.c in src/hardware/r_sdlgpu/precompiled." >> "$GITHUB_STEP_SUMMARY"
       fi

    - name: Upload the Direct3D 12 shaders
      uses: actions/upload-artifact@v7.0.1
      with:
        name: sdlgpu-shaders-dxil
        path: src/hardware/r_sdlgpu/precompiled/dxil.c
